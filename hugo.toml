baseURL = "https://vishsant.github.io/digital-garden/"
locale = "en-us"
title = "vishsant notes"
theme = "kavu"
contentDir = "digital-garden"
ignoreFiles = ["inbox"]
copyright = "Vishnu Santhosh"
enableRobotsTXT = true

[params]
  name = "Vishnu Santhosh"
  description = "A growing collection of notes, ideas, and explorations."
  initials = "VS"
  author = "Vishnu Santhosh"
  authorURL = "https://vishsant.github.io/about/"
  tagline = "Digital Garden"
  headerBrandText = "vishsant"
  headerLogoURL = "https://vishsant.github.io/"

[[params.tagGroups]]
  name = "Engineering & Systems"
  tags = ["engineering", "software-architecture", "distributed-systems", "infrastructure", "devops", "federation", "protocols", "linux", "toolchain", "embedded", "arm"]
[[params.tagGroups]]
  name = "Decision & Strategy"
  tags = ["strategy", "leadership", "decision-making", "framework", "prioritization"]
[[params.tagGroups]]
  name = "Mindset & Growth"
  tags = ["mindset", "personal-growth", "resilience", "philosophy", "communication", "stoicism", "self-awareness"]
[[params.tagGroups]]
  name = "Research & Craft"
  tags = ["note-taking", "zettelkasten", "process", "research", "writing"]
[[params.tagGroups]]
  name = "Product & Metrics"
  tags = ["product", "metrics", "measurement", "lean", "marketing"]
[[params.tagGroups]]
  name = "Law & Society"
  tags = ["law", "cybercrime", "rights", "society"]
[[params.tagGroups]]
  name = "Stories & Culture"
  tags = ["storytelling", "history", "etymology", "culture"]

[taxonomies]
  tag = "tags"

[markup]
  [markup.highlight]
    noClasses = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[[menus.main]]
  name = "notes"
  url = "https://vishsant.github.io/digital-garden/"
  weight = 1
[[menus.main]]
  name = "blog"
  url = "https://vishsant.github.io/post/"
  weight = 2
[[menus.main]]
  name = "projects"
  url = "https://vishsant.github.io/projects/"
  weight = 3
[[menus.main]]
  name = "now"
  url = "https://vishsant.github.io/now/"
  weight = 4
[[menus.main]]
