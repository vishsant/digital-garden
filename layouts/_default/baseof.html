<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
    {{- partial "head.html" . -}}
    <body>
    <script>!function(){var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(t==='dark'){document.documentElement.style.backgroundColor='#1e1e1e';document.body.style.backgroundColor='#1e1e1e'}}()</script>
        <div class="wrapper" style="width: 100%; min-height: 100vh; max-width: 90ch; margin: 0 auto; padding: 1.5rem;">
            {{- partial "header.html" . -}}
            <div id="content">
                {{- block "main" . }}{{- end }}
            </div>
            {{- partial "footer.html" . -}}
        </div>
        {{- partial "script.html" . -}}
    </body>
</html>
